# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix long delay for updating the status bar
set -g status-interval 1

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# remove escape-time for vim delay
set -sg escape-time 0

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# APPEARANCE - Catppuccin Mocha
# ============================================

# kanagawa dragon (saturated)
set -g status-style "bg=#1d1b1b,fg=#cfe7cf"
set -g status-left-style "bg=#2d2c2c,fg=#cfe7cf"
set -g status-right-style "bg=#2d2c2c,fg=#cfe7cf"
set -g window-status-current-style "bg=#8cbfd8,fg=#1d1b1b"
set -g window-status-style "bg=#1d1b1b,fg=#67635f"
set -g pane-border-style "fg=#3e3d3b"
set -g pane-active-border-style "fg=#8cbfd8"
set -g message-style "bg=#2d2c2c,fg=#e6cc91"
set -g mode-style "bg=#8cbfd8,fg=#1d1b1b"

# terminal colors for resurrect
set -g @color-bg "#1d1b1b"
set -g @color-fg "#cfe7cf"
set -g @color-accent "#8cbfd8"

# add more padding around items
set -g status-left " [#S] #W  "
set -g status-right "  %H:%M %d-%b-%y "
set -g status-left-length 40

set -g window-status-format " #I:#W#F "          # space either side
set -g window-status-current-format " #I:#W#F "  # same for active

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
