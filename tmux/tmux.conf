# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix long delay for updating the status bar
set -g status-interval 1

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# remove escape-time for vim delay
set -sg escape-time 0

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# smartsplits integration
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# smart-splits: resize aware of nvim splits
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# ============================================
# APPEARANCE - gruvbox material dark
# ============================================

# gruvbox material dark
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left-style "bg=#3c3836,fg=#d4be98"
set -g status-right-style "bg=#3c3836,fg=#d4be98"
set -g window-status-current-style "bg=#a9b665,fg=#282828"
set -g window-status-style "bg=#282828,fg=#665c54"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#3c3836,fg=#e78a4e"
set -g mode-style "bg=#a9b665,fg=#282828"

# terminal colors for resurrect
set -g @color-bg "#282828"
set -g @color-fg "#d4be98"
set -g @color-accent "#a9b665"

# status bar styling
set -g status-left " [#S] #W  "
set -g status-right "  %H:%M %d-%b-%y "
set -g status-left-length 40

set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
